server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;  # SPA 路由支持
        # index.html 必须每次回源校验，否则改版后浏览器还会用旧的 index.html
        # 去引用旧 hash 的 bundle，表现为「代码改了但界面没变」
        add_header Cache-Control "no-cache";
    }

    # 带内容 hash 的构建产物可以长期强缓存
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 通知的 SSE 长连接：必须单独一个 location。
    # 下面 /api/ 的 proxy_read_timeout 只有 90 秒，且 nginx 默认会把响应先攒进缓冲区，
    # 结果就是"后端推了、浏览器收不到"或"连接每隔 90 秒断一次"。
    # 服务端每 15 秒发一次心跳注释帧保活，这里给到 1 小时的读超时。
    location = /api/notifications/stream {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 代理所有 /api 请求到后端网关
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}