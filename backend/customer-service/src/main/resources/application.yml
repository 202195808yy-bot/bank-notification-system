server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/bank_notifications
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      connect-timeout: 5000ms

jwt:
  secret: ${JWT_SECRET:bXktc2VjcmV0LWtleS1mb3ItYmFuay1ub3RpZmljYXRpb24=}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# 只接受带此令牌的请求（网关或内部服务），防止绕过网关伪造 X-User-Id
internal:
  api:
    token: ${INTERNAL_API_TOKEN:ZGV2LWludGVybmFsLWFwaS10b2tlbi0yMDI2}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.bank.customer: INFO
